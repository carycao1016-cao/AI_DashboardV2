[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dashboard-parser-poc"
version = "0.1.0"
description = "Offline proof of concept for AI-assisted Tab Book structure recognition"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.5,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[tool.setuptools.packages.find]
include = ["parser_poc*"]

[tool.ruff]
target-version = "py312"
line-length = 120
